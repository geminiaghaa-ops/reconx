<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReconX</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">⬡</span> ReconX <span class="sub">bug bounty recon</span></div>
  <button id="env-btn" class="ghost" onclick="toggleEnv()">⚙ Engines &amp; tools</button>
</header>
<div id="env-panel" class="env-panel" style="display:none"></div>

<main>
  <aside class="sidebar">
    <form id="add-form" class="card">
      <h3>Add target</h3>
      <input id="domain" placeholder="example.com" autocomplete="off" required>
      <textarea id="scope_in" placeholder="In-scope (optional)&#10;*.example.com&#10;api.example.com"></textarea>
      <textarea id="scope_out" placeholder="Out-of-scope (optional)&#10;blog.example.com"></textarea>
      <details class="auth-box">
        <summary>🔑 Login / auth (optional)</summary>
        <textarea id="auth_cookie" placeholder="Session cookie&#10;sid=abc123; csrf=xyz"></textarea>
        <textarea id="auth_headers" placeholder="Extra headers, one per line&#10;Authorization: Bearer eyJ…"></textarea>
        <div class="hint">Sent only to in-scope hosts. Stripped on out-of-scope redirects.</div>
      </details>
      <button type="submit">+ Add target</button>
    </form>
    <div id="targets" class="targets"></div>
  </aside>

  <section id="detail" class="detail">
    <div class="empty">Select or add a target to begin.</div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
